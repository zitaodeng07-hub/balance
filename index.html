<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050816" />
    <meta name="description" content="收入即时可视化与轻激励专注工具" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Balance" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <title>Balance</title>
    <script>
      window.__balanceBoot = [];
      window.__balanceLog = function (message) {
        window.__balanceBoot.push(new Date().toISOString() + ' ' + message);
        var panel = document.getElementById('boot-log');
        if (panel) panel.textContent = window.__balanceBoot.join('\n');
      };
      window.addEventListener('error', function (event) {
        window.__balanceLog('ERROR: ' + event.message + ' @ ' + event.filename + ':' + event.lineno + ':' + event.colno);
      });
      window.addEventListener('unhandledrejection', function (event) {
        window.__balanceLog('PROMISE: ' + (event.reason && event.reason.message ? event.reason.message : String(event.reason)));
      });
      window.__balanceLog('html-start');
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#050816;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center;">
        <div>
          <h1 style="margin:0 0 12px;font-size:24px;">Balance 正在启动</h1>
          <p style="margin:0;line-height:1.6;color:#94a3b8;">如果长时间停留在这里，请刷新页面或升级 iOS Safari。</p>
          <pre id="boot-log" style="margin:18px auto 0;max-width:330px;white-space:pre-wrap;text-align:left;color:#67ffd0;background:rgba(255,255,255,.06);border-radius:12px;padding:12px;font-size:11px;line-height:1.45;">html-start</pre>
        </div>
      </div>
    </div>
    <script nomodule>
      document.getElementById('root').innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#050816;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;text-align:center;"><div><h1 style="margin:0 0 12px;font-size:24px;">需要兼容模式</h1><p style="margin:0;line-height:1.6;color:#94a3b8;">正在加载旧版 iPhone Safari 兼容脚本，请稍等。</p></div></div>';
    </script>
  </body>
</html>
