<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Balance Debug</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        background: #050816;
        color: #e5e7eb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .card {
        max-width: 520px;
        margin: 0 auto;
        padding: 18px;
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 22px;
        background: rgba(15, 23, 42, 0.78);
      }
      h1 { margin: 0 0 12px; font-size: 24px; }
      pre {
        white-space: pre-wrap;
        color: #67ffd0;
        background: rgba(255,255,255,.06);
        border-radius: 14px;
        padding: 14px;
        line-height: 1.55;
      }
      a { color: #93c5fd; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Balance Safari 诊断页</h1>
      <p>如果你能看到这一页，说明 Safari 能正常访问 GitHub Pages 静态页面。</p>
      <pre id="log">loading...</pre>
      <p><a id="app-link" href="./?debug=1&v=6">打开应用诊断模式</a></p>
      <p><button id="reset-sw" type="button">清理本页缓存和 Service Worker</button></p>
    </main>
    <script>
      var lines = [];
      function log(name, value) { lines.push(name + ': ' + value); }
      var appUrl = new URL('./?debug=1&v=6', window.location.href);
      document.getElementById('app-link').href = appUrl.href;
      log('time', new Date().toISOString());
      log('location', window.location.href);
      log('appLink', appUrl.href);
      log('userAgent', navigator.userAgent);
      log('standalone', navigator.standalone === true);
      log('localStorage', (function () { try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return 'ok'; } catch (e) { return e.message; } })());
      log('serviceWorker', 'serviceWorker' in navigator);
      log('AudioContext', !!(window.AudioContext || window.webkitAudioContext));
      log('moduleScript', 'noModule' in document.createElement('script'));
      document.getElementById('log').textContent = lines.join('\n');
      document.getElementById('reset-sw').addEventListener('click', function () {
        var tasks = [];
        if ('serviceWorker' in navigator) {
          tasks.push(navigator.serviceWorker.getRegistrations().then(function (registrations) {
            return Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
          }));
        }
        if ('caches' in window) {
          tasks.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (key) { return caches.delete(key); }));
          }));
        }
        Promise.all(tasks).then(function () {
          lines.push('reset: ok');
          document.getElementById('log').textContent = lines.join('\n');
        }).catch(function (error) {
          lines.push('reset: ' + (error && error.message ? error.message : String(error)));
          document.getElementById('log').textContent = lines.join('\n');
        });
      });
    </script>
  </body>
</html>
